[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "invoicing-agent"
version = "0.1.0"
description = "AgentComms invoicing agent example"
requires-python = ">=3.11"
dependencies = [
    "agentcomms>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
