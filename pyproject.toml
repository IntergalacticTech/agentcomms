[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "freemail"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "adapters*", "lambdas*"]
exclude = ["tests*", "cdk*", "console*", "sdks*", "mcp*", "docs*"]

[project.optional-dependencies]
test = ["pyotp>=2.9"]

# NOTE: pytest configuration lives in pytest.ini (the single source of truth).
# Do not add a [tool.pytest.ini_options] block here — pytest ignores it when
# pytest.ini is present, which silently shadows any settings placed here.
