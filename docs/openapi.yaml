openapi: 3.0.3
info:
  title: FreeMail API
  description: Identity and communications API for AI agents. Provides programmatic inbox management, message sending/receiving, OTP capture, domain configuration, and real-time email waiting.
  version: 1.1.0
  contact:
    name: FreeMail
    url: https://victorymail.dev

servers:
  - url: https://api.victorymail.dev/v1
    description: Production

security:
  - ApiKeyHeader: []
  - BearerAuth: []

tags:
  - name: Agent
    description: Account signup and verification (no auth required)
  - name: Organizations
    description: Organization management
  - name: API Keys
    description: API key management
  - name: Pods
    description: Logical groupings of inboxes
  - name: Inboxes
    description: Email inbox management
  - name: Messages
    description: Send, receive, and manage email messages
  - name: Threads
    description: Email thread management
  - name: Drafts
    description: Draft message management
  - name: Attachments
    description: Message attachment access
  - name: Domains
    description: Custom domain management
  - name: Webhooks
    description: Webhook endpoint management
  - name: Lists
    description: Mailing list management
  - name: Wait
    description: Long-poll for incoming messages and OTP extraction
  - name: Search
    description: Full-text search across messages in your organization
  - name: AI
    description: Categorize, extract, and summarize messages using Bedrock Claude (Starter tier and above)
  - name: Metrics
    description: Usage counters and aggregate queries
  - name: Billing
    description: Subscription, checkout, and Stripe webhooks

paths:
  # ── Agent (no auth) ──────────────────────────────────────────────
  /agent/signup:
    post:
      tags: [Agent]
      summary: Start account signup
      description: Sends a one-time verification code to the provided email.
      operationId: agentSignup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: admin@example.com
      responses:
        '201':
          description: Verification code sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Verification code sent
                  email:
                    type: string
                    format: email
                    example: admin@example.com
        '400':
          $ref: '#/components/responses/BadRequest'

  /agent/verify:
    post:
      tags: [Agent]
      summary: Verify OTP and create account
      description: Validates the verification code and creates the organization with an initial API key.
      operationId: agentVerify
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                  example: admin@example.com
                code:
                  type: string
                  example: "482917"
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  organization:
                    type: object
                    properties:
                      id:
                        $ref: '#/components/schemas/Ulid'
                      name:
                        type: string
                      email:
                        type: string
                        format: email
                      tier:
                        type: string
                        example: free
                      status:
                        type: string
                        example: active
                  api_key:
                    type: object
                    properties:
                      id:
                        $ref: '#/components/schemas/Ulid'
                      key:
                        type: string
                        description: Plaintext API key. Shown only once.
                        example: am_live_7kB3mN9pQ2rX5vW8yA1cD4eF6gH0jL
                      key_prefix:
                        type: string
                        example: am_live_7kB3
                      scope:
                        type: string
                        example: org
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── Organizations ────────────────────────────────────────────────
  /organizations/me:
    get:
      tags: [Organizations]
      summary: Get current organization
      operationId: getOrganization
      responses:
        '200':
          description: Organization details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── API Keys ─────────────────────────────────────────────────────
  /api-keys:
    get:
      tags: [API Keys]
      summary: List API keys
      operationId: listApiKeys
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Paginated list of API keys
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ApiKey'
    post:
      tags: [API Keys]
      summary: Create an API key
      operationId: createApiKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scope]
              properties:
                name:
                  type: string
                  example: Worker Key
                scope:
                  type: string
                  enum: [org, pod, inbox]
                scope_resource_id:
                  $ref: '#/components/schemas/Ulid'
      responses:
        '201':
          description: API key created. The `key` field is shown only once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
    delete:
      tags: [API Keys]
      summary: Revoke all API keys
      operationId: deleteAllApiKeys
      responses:
        '204':
          description: All keys revoked

  /api-keys/{id}:
    delete:
      tags: [API Keys]
      summary: Revoke an API key
      operationId: deleteApiKey
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Key revoked
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Pods ─────────────────────────────────────────────────────────
  /pods:
    get:
      tags: [Pods]
      summary: List pods
      operationId: listPods
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Paginated list of pods
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Pod'
    post:
      tags: [Pods]
      summary: Create a pod
      operationId: createPod
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: Customer Outreach
                settings:
                  type: object
                  additionalProperties: true
      responses:
        '201':
          description: Pod created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pod'
        '400':
          $ref: '#/components/responses/BadRequest'

  /pods/{id}:
    get:
      tags: [Pods]
      summary: Get a pod
      operationId: getPod
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Pod details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pod'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Pods]
      summary: Delete a pod
      description: Fails if the pod contains any inboxes.
      operationId: deletePod
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Pod deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Inboxes ──────────────────────────────────────────────────────
  /inboxes:
    get:
      tags: [Inboxes]
      summary: List inboxes
      operationId: listInboxes
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/Order'
        - name: pod_id
          in: query
          schema:
            $ref: '#/components/schemas/Ulid'
          description: Filter by pod
      responses:
        '200':
          description: Paginated list of inboxes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Inbox'
    post:
      tags: [Inboxes]
      summary: Create an inbox
      operationId: createInbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: Desired email address. If omitted, a random address is generated on the platform domain chosen via `domain`. Must be on a platform domain or a custom domain you have verified.
                domain:
                  type: string
                  description: Which platform domain to generate the random address on. Ignored when `email` is set.
                  enum:
                    - victorymail.dev
                    - karmascale.net
                    - karmascale.org
                  default: victorymail.dev
                display_name:
                  type: string
                pod_id:
                  $ref: '#/components/schemas/Ulid'
                settings:
                  type: object
                  additionalProperties: true
                forwarding:
                  type: object
                  additionalProperties: true
      responses:
        '201':
          description: Inbox created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inbox'
        '400':
          $ref: '#/components/responses/BadRequest'

  /inboxes/{id}:
    get:
      tags: [Inboxes]
      summary: Get an inbox
      operationId: getInbox
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Inbox details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inbox'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Inboxes]
      summary: Update an inbox
      operationId: updateInbox
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                settings:
                  type: object
                  additionalProperties: true
                forwarding:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Inbox updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inbox'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Inboxes]
      summary: Delete an inbox
      description: Soft-deletes the inbox and its messages.
      operationId: deleteInbox
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Inbox deleted
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Messages ─────────────────────────────────────────────────────
  /inboxes/{id}/messages:
    get:
      tags: [Messages]
      summary: List messages in an inbox
      operationId: listMessages
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Paginated list of messages
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/MessageSummary'
    post:
      tags: [Messages]
      summary: Send a new message
      operationId: sendMessage
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '201':
          description: Message sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDetail'
        '400':
          $ref: '#/components/responses/BadRequest'

  /inboxes/{id}/messages/{mid}:
    get:
      tags: [Messages]
      summary: Get a message
      operationId: getMessage
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/MessageId'
      responses:
        '200':
          description: Full message with body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Messages]
      summary: Update message metadata
      operationId: updateMessage
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/MessageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_read:
                  type: boolean
                is_starred:
                  type: boolean
                is_trash:
                  type: boolean
                labels:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Message updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /inboxes/{id}/messages/{mid}/reply:
    post:
      tags: [Messages]
      summary: Reply to a message
      operationId: replyToMessage
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/MessageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplyRequest'
      responses:
        '201':
          description: Reply sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /inboxes/{id}/messages/{mid}/reply-all:
    post:
      tags: [Messages]
      summary: Reply-all to a message
      operationId: replyAllToMessage
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/MessageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplyRequest'
      responses:
        '201':
          description: Reply-all sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /inboxes/{id}/messages/{mid}/forward:
    post:
      tags: [Messages]
      summary: Forward a message
      operationId: forwardMessage
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/MessageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to:
                  type: array
                  items:
                    $ref: '#/components/schemas/Recipient'
                body_text:
                  type: string
                body_html:
                  type: string
      responses:
        '201':
          description: Message forwarded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Attachments ──────────────────────────────────────────────────
  /inboxes/{id}/messages/{mid}/attachments:
    get:
      tags: [Attachments]
      summary: List message attachments
      operationId: listAttachments
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/MessageId'
      responses:
        '200':
          description: List of attachments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Attachment'

  /inboxes/{id}/messages/{mid}/attachments/{aid}:
    get:
      tags: [Attachments]
      summary: Download an attachment
      description: Returns a 302 redirect to a pre-signed S3 URL (15-minute expiry).
      operationId: getAttachment
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/MessageId'
        - name: aid
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
          description: Attachment ID
      responses:
        '302':
          description: Redirect to pre-signed download URL
          headers:
            Location:
              schema:
                type: string
                format: uri
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Threads ──────────────────────────────────────────────────────
  /inboxes/{id}/threads:
    get:
      tags: [Threads]
      summary: List threads in an inbox
      operationId: listThreads
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Paginated list of threads
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Thread'

  /inboxes/{id}/threads/{tid}:
    get:
      tags: [Threads]
      summary: Get a thread with messages
      operationId: getThread
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: tid
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
          description: Thread ID
      responses:
        '200':
          description: Thread with embedded messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Threads]
      summary: Update thread metadata
      operationId: updateThread
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: tid
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
          description: Thread ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_read:
                  type: boolean
                is_starred:
                  type: boolean
                is_trash:
                  type: boolean
                labels:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Thread updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thread'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Threads]
      summary: Soft-delete a thread
      operationId: deleteThread
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: tid
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
          description: Thread ID
      responses:
        '200':
          description: Thread moved to trash
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thread'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Drafts ───────────────────────────────────────────────────────
  /inboxes/{id}/drafts:
    get:
      tags: [Drafts]
      summary: List drafts
      operationId: listDrafts
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: Paginated list of drafts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Draft'
    post:
      tags: [Drafts]
      summary: Create a draft
      operationId: createDraft
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftRequest'
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Draft'
        '400':
          $ref: '#/components/responses/BadRequest'

  /inboxes/{id}/drafts/{did}:
    get:
      tags: [Drafts]
      summary: Get a draft
      operationId: getDraft
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: did
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
          description: Draft ID
      responses:
        '200':
          description: Draft details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Draft'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Drafts]
      summary: Update a draft
      operationId: updateDraft
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: did
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
          description: Draft ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftRequest'
      responses:
        '200':
          description: Draft updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Draft'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Drafts]
      summary: Delete a draft
      operationId: deleteDraft
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: did
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
          description: Draft ID
      responses:
        '204':
          description: Draft deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /inboxes/{id}/drafts/{did}/send:
    post:
      tags: [Drafts]
      summary: Send a draft
      description: Converts the draft to a sent message and deletes the draft.
      operationId: sendDraft
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: did
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
          description: Draft ID
      responses:
        '201':
          description: Draft sent as message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Wait / Extract OTP ──────────────────────────────────────────
  /inboxes/{id}/wait:
    post:
      tags: [Wait]
      summary: Wait for a matching message
      description: Long-polls for up to 25 seconds for a message matching the provided filters.
      operationId: waitForMessage
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                timeout:
                  type: integer
                  description: Max seconds to wait (capped at 25).
                  default: 25
                  maximum: 25
                filter:
                  type: object
                  properties:
                    from:
                      type: string
                      description: Sender address substring match.
                    subject_contains:
                      type: string
                    after:
                      type: string
                      format: date-time
                      description: Only messages created after this timestamp.
                    is_read:
                      type: boolean
      responses:
        '200':
          description: Matching message found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDetail'
        '408':
          description: Timeout - no matching message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /inboxes/{id}/extract-otp:
    post:
      tags: [Wait]
      summary: Wait for a message and extract OTP code
      description: Waits for a matching message, then extracts a verification/OTP code from the body.
      operationId: extractOtp
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                timeout:
                  type: integer
                  default: 25
                  maximum: 25
                sender:
                  type: string
                  description: Filter by sender address substring.
                subject_contains:
                  type: string
                after:
                  type: string
                  format: date-time
      responses:
        '200':
          description: OTP extracted (code may be null if not found)
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    nullable: true
                    description: Extracted OTP code, or null if none found.
                    example: "482917"
                  message_id:
                    $ref: '#/components/schemas/Ulid'
                  from:
                    type: string
                    format: email
                  subject:
                    type: string
                  body_text:
                    type: string
                    description: Included only when code is null, for manual inspection.
        '408':
          description: Timeout - no matching message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ── Domains ──────────────────────────────────────────────────────
