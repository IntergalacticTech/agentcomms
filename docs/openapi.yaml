          content:
            application/json:
              schema:
                type: object
                properties:
                  org_id:
                    $ref: '#/components/schemas/Ulid'
                  tier:
                    type: string
                    enum: [free, starter, pro, enterprise]
                  billing_status:
                    type: string
                    enum: [none, trialing, active, past_due, canceled]
                  stripe_customer_id:
                    type: string
                    nullable: true

  /billing/checkout:
    post:
      tags: [Billing]
      summary: Create a Stripe Checkout session for a paid tier
      operationId: billingCheckout
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                tier:
                  type: string
                  enum: [starter, pro]
                  default: pro
                  description: Target tier for the subscription
      responses:
        '200':
          description: Checkout session URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkout_url:
                    type: string
                    format: uri
                  tier:
                    type: string

  /billing/portal:
    post:
      tags: [Billing]
      summary: Create a Stripe Billing Portal session
      operationId: billingPortal
      responses:
        '200':
          description: Portal URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  portal_url:
                    type: string
                    format: uri

  /console/signup:
    post:
      tags: [Agent]
      summary: Console signup with email + password (no auth required)
      description: |
        Creates a new organization and returns an API key immediately. Unlike
        `/agent/signup` this does not require OTP verification — the password
        serves as the account credential.
      operationId: consoleSignup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                name:
                  type: string
      responses:
        '201':
          description: Organization and API key created
          content:
            application/json:
              schema:
                type: object
                properties:
                  organization:
                    $ref: '#/components/schemas/Organization'
                  api_key:
                    type: string
                    description: Full API key string (shown only at creation)

  /console/login:
    post:
      tags: [Agent]
      summary: Console login with email + password (no auth required)
      operationId: consoleLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Session tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  id_token:
                    type: string
                  refresh_token:
                    type: string
                  expires_in:
                    type: integer

  /console/refresh:
    post:
      tags: [Agent]
      summary: Refresh a console session (no auth required)
      operationId: consoleRefresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: New access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  expires_in:
                    type: integer

  /console/me:
    get:
      tags: [Agent]
      summary: Get the current console user (JWT auth)
      operationId: consoleMe
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                  name:
                    type: string
                  org_id:
                    $ref: '#/components/schemas/Ulid'
                  tier:
                    type: string

  /billing/webhook:
    post:
      tags: [Billing]
      summary: Stripe webhook receiver (no API key auth)
      description: |
        Stripe posts subscription lifecycle events here. The handler verifies
        the `Stripe-Signature` header against a shared secret, not an API key.
        Do not call this endpoint from your application code.
      operationId: billingWebhook
      security: []
      parameters:
        - in: header
          name: Stripe-Signature
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Event received
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean

components:
  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: x-api-key
    BearerAuth:
      type: http
      scheme: bearer

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
      description: Resource ID (ULID)
    MessageId:
      name: mid
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
      description: Message ID
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Maximum items to return.
    PageToken:
      name: page_token
      in: query
      schema:
        type: string
      description: Opaque cursor from a previous response's next_page_token.
    Order:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc
      description: Sort order. Default is descending (newest first).

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    Ulid:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
      description: 26-character Crockford Base32 ULID
      example: 01HXYZ1234567890ABCDEFGHJK

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: NOT_FOUND
            message:
              type: string
              example: Resource not found

    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items: {}
        next_page_token:
          type: string
          nullable: true
          description: Opaque cursor for the next page. Null when no more results.
        has_more:
          type: boolean

    Recipient:
      type: object
      required: [address]
      properties:
        name:
          type: string
        address:
          type: string
          format: email

    # ── Organization ───────────────────────────────────────────────
    Organization:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
          example: Acme Corp
        email:
          type: string
          format: email
        tier:
          type: string
          enum: [free, starter, pro, enterprise]
        status:
          type: string
          enum: [active, suspended]
        settings:
          type: object
          additionalProperties: true
        quotas:
          type: object
          properties:
            max_inboxes:
              type: integer
            max_messages_per_day:
              type: integer
            max_api_keys:
              type: integer
            max_pods:
              type: integer
            max_domains:
              type: integer
            max_webhooks:
              type: integer
        usage:
          type: object
          additionalProperties:
            type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ── API Key ────────────────────────────────────────────────────
    ApiKey:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
        key_prefix:
          type: string
          example: am_live_7kB3
        scope:
          type: string
          enum: [org, pod, inbox]
        scope_resource_id:
          $ref: '#/components/schemas/Ulid'
        status:
          type: string
          enum: [active, revoked]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ApiKeyCreated:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
        key:
          type: string
          description: Plaintext API key. Shown only at creation time.
          example: am_live_4tU7wP0qS3xY6zA9bC2dE5fG8hJ1kM
        key_prefix:
          type: string
          example: am_live_4tU7
        scope:
          type: string
          enum: [org, pod, inbox]
        scope_resource_id:
          $ref: '#/components/schemas/Ulid'
        status:
          type: string
          example: active
        created_at:
          type: string
          format: date-time

    # ── Pod ────────────────────────────────────────────────────────
    Pod:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
          example: Customer Outreach
        description:
          type: string
        org_id:
          $ref: '#/components/schemas/Ulid'
        inbox_count:
          type: integer
        status:
          type: string
          enum: [active]
        settings:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ── Inbox ──────────────────────────────────────────────────────
    Inbox:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        org_id:
          $ref: '#/components/schemas/Ulid'
        pod_id:
          type: string
          description: Pod ID or "default"
        email:
          type: string
          format: email
          example: agent-47@victorymail.dev
        display_name:
          type: string
        status:
          type: string
          enum: [active, deleted]
        message_count:
          type: integer
        unread_count:
          type: integer
        settings:
          type: object
          additionalProperties: true
        forwarding:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ── Message ────────────────────────────────────────────────────
    MessageSummary:
      type: object
      description: Message summary (list view, no body).
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        thread_id:
          $ref: '#/components/schemas/Ulid'
        inbox_id:
          $ref: '#/components/schemas/Ulid'
        direction:
          type: string
          enum: [inbound, outbound]
        from_addr:
          $ref: '#/components/schemas/Recipient'
          description: Sender as {name, address}.
        to:
          type: array
          items:
            $ref: '#/components/schemas/Recipient'
        cc:
          type: array
          items:
            $ref: '#/components/schemas/Recipient'
        subject:
          type: string
        snippet:
          type: string
          description: First ~200 characters of body text
        is_read:
          type: boolean
        is_starred:
          type: boolean
        is_spam:
          type: boolean
        is_trash:
          type: boolean
        labels:
          type: array
          items:
            type: string
        category:
          type: string
        has_attachments:
          type: boolean
        attachment_count:
          type: integer
        received_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    MessageDetail:
      type: object
      description: Full message including body content.
      allOf:
        - $ref: '#/components/schemas/MessageSummary'
        - type: object
          properties:
            bcc:
              type: array
              items:
                $ref: '#/components/schemas/Recipient'
            reply_to:
              type: array
              items:
                $ref: '#/components/schemas/Recipient'
            body_text:
              type: string
            body_html:
              type: string
            headers:
              type: object
              additionalProperties:
                type: string
            ses_message_id:
              type: string
            status:
              type: string
              enum: [queued, sent, delivered, bounced, failed]

    SendMessageRequest:
      type: object
      required: [to, subject]
      properties:
        to:
          type: array
          items:
            oneOf:
              - type: string
                format: email
              - $ref: '#/components/schemas/Recipient'
        cc:
          type: array
          items:
            oneOf:
              - type: string
                format: email
              - $ref: '#/components/schemas/Recipient'
        bcc:
          type: array
          items:
            oneOf:
              - type: string
                format: email
              - $ref: '#/components/schemas/Recipient'
        reply_to:
          type: string
        subject:
          type: string
        body_text:
          type: string
          description: Plain text body. At least one of body_text or body_html required.
        body_html:
          type: string
          description: HTML body.
        labels:
          type: array
          items:
            type: string
        category:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string

    ReplyRequest:
      type: object
      properties:
        to:
          type: array
          items:
            oneOf:
              - type: string
                format: email
              - $ref: '#/components/schemas/Recipient'
          description: Override recipients (defaults to original sender).
        body_text:
          type: string
        body_html:
          type: string
        attachments:
          type: array
          items:
            type: object

    # ── Thread ─────────────────────────────────────────────────────
    Thread:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        inbox_id:
          $ref: '#/components/schemas/Ulid'
        subject:
          type: string
        snippet:
          type: string
        message_count:
          type: integer
        is_read:
          type: boolean
        is_starred:
          type: boolean
        is_trash:
          type: boolean
        labels:
          type: array
          items:
            type: string
        last_message_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ThreadDetail:
      allOf:
        - $ref: '#/components/schemas/Thread'
        - type: object
          properties:
            messages:
              type: array
              items:
                $ref: '#/components/schemas/MessageSummary'

    # ── Draft ──────────────────────────────────────────────────────
    Draft:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        inbox_id:
          $ref: '#/components/schemas/Ulid'
        thread_id:
          type: string
        in_reply_to_message_id:
          type: string
        to:
          type: array
          items:
            type: string
        cc:
          type: array
          items:
            type: string
        bcc:
          type: array
          items:
            type: string
        subject:
          type: string
        body_text:
          type: string
        body_html:
          type: string
        attachments:
          type: array
          items:
            type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DraftRequest:
      type: object
      properties:
        to:
          type: array
          items:
            oneOf:
              - type: string
                format: email
              - $ref: '#/components/schemas/Recipient'
        cc:
          type: array
          items:
            type: string
        bcc:
          type: array
          items:
            type: string
        subject:
          type: string
        body_text:
          type: string
        body_html:
          type: string
        attachments:
          type: array
          items:
            type: object
        thread_id:
          type: string
        in_reply_to_message_id:
          type: string

    # ── Attachment ─────────────────────────────────────────────────
    Attachment:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        filename:
          type: string
          example: requirements.pdf
        content_type:
          type: string
          example: application/pdf
        size:
          type: integer
          description: File size in bytes
        is_inline:
          type: boolean
        content_id:
          type: string
        created_at:
          type: string
          format: date-time

    # ── Domain ─────────────────────────────────────────────────────
    Domain:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        domain:
          type: string
          example: mail.acme.com
        status:
          type: string
          enum: [pending, verifying, verified, failed]
        mx_verified:
          type: boolean
        spf_verified:
          type: boolean
        dkim_verified:
          type: boolean
        dmarc_verified:
          type: boolean
        dns_records:
          $ref: '#/components/schemas/DnsRecords'
        catch_all_inbox_id:
          type: string
        created_at:
          type: string
          format: date-time
        verified_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time

    DnsRecords:
      type: object
      properties:
        mx:
          $ref: '#/components/schemas/DnsRecord'
        spf:
          $ref: '#/components/schemas/DnsRecord'
        dkim:
          type: array
          items:
            $ref: '#/components/schemas/DnsRecord'
        dmarc:
          $ref: '#/components/schemas/DnsRecord'

    DnsRecord:
      type: object
      properties:
        type:
          type: string
          enum: [MX, TXT, CNAME]
        name:
          type: string
        value:
          type: string
        ttl:
          type: integer
          example: 3600

    # ── Webhook ────────────────────────────────────────────────────
    Webhook:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEvent'
        status:
          type: string
          enum: [active, paused]
        secret:
          type: string
          description: HMAC signing secret (whsec_ prefixed)
          example: whsec_abc123def456
        filter:
          $ref: '#/components/schemas/WebhookFilter'
        delivery_stats:
          type: object
          properties:
            total:
              type: integer
            success:
              type: integer
            failed:
              type: integer
            last_delivered_at:
              type: string
              format: date-time
              nullable: true
            last_failed_at:
              type: string
              format: date-time
              nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WebhookEvent:
      type: string
      enum:
        - message.received
        - message.sent
        - message.bounced
        - message.complained
        - message.delayed
        - inbox.created
        - inbox.deleted
        - domain.verified
        - domain.failed
        - subscription.updated

    WebhookFilter:
      type: object
      properties:
        pod_ids:
          type: array
          items:
            $ref: '#/components/schemas/Ulid'
        inbox_ids:
          type: array
          items:
            $ref: '#/components/schemas/Ulid'

    # ── Mailing List ───────────────────────────────────────────────
    List:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
          example: Product Updates
        inbox_id:
          $ref: '#/components/schemas/Ulid'
        member_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ListWithMembers:
      allOf:
        - $ref: '#/components/schemas/List'
        - type: object
          properties:
            members:
              type: array
              items:
                $ref: '#/components/schemas/ListMember'
            next_page_token:
              type: string
              nullable: true
            has_more:
              type: boolean

    ListMember:
      type: object
      properties:
        address:
          type: string
          format: email
        name:
          type: string
        subscribed_at:
          type: string
          format: date-time

    ListMemberInput:
      type: object
      required: [address]
      properties:
        address:
          type: string
          format: email
        name:
          type: string
