                start:
                  type: string
                  format: date-time
                end:
                  type: string
                  format: date-time
                group_by:
                  type: string
      responses:
        '200':
          description: Aggregated data points
          content:
            application/json:
              schema:
                type: object
                properties:
                  metric:
                    type: string
                  period:
                    type: string
                  start:
                    type: string
                  end:
                    type: string
                  group_by:
                    type: string
                    nullable: true
                  data:
                    type: array
                    items:
                      type: object

  /metrics/usage:
