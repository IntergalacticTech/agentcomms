name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    needs: []  # Could depend on CI workflow via workflow_call
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cdk/package-lock.json

      - name: Install CDK dependencies
        run: cd cdk && npm ci

      - name: Build console
        run: cd console && npm ci && npm run build

      - name: Install Lambda dependencies
        run: cd lambdas && pip install stripe -t . --quiet

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AGENTCOMMS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: CDK Deploy
        # Deploy only the AgentComms stacks (AgentCommsData, AgentCommsEvents,
        # AgentCommsApi, AgentCommsAdapters, and its AgentCommsAdapters-* adapter
        # sub-stacks). The retired victorymail/legacy stacks are intentionally
        # excluded so they are not re-synthed or re-deployed.
        run: cd cdk && npx cdk deploy 'AgentComms*' --require-approval never
