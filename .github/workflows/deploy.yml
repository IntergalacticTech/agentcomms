name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    needs: []  # Could depend on CI workflow via workflow_call
    environment: production
    env:
      AGENTCOMMS_DEPLOY_STAGE: ${{ vars.AGENTCOMMS_DEPLOY_STAGE || 'prod' }}
      AGENTCOMMS_DEPLOY_ENV_NAME: ${{ vars.AGENTCOMMS_DEPLOY_ENV_NAME || 'prod' }}
      AGENTCOMMS_DOMAIN: ${{ vars.AGENTCOMMS_DOMAIN || 'agentcomms.dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cdk/package-lock.json

      - name: Install CDK dependencies
        run: cd cdk && npm ci

      - name: Build console
        run: cd console && npm ci && npm run build

      - name: Install Lambda dependencies
        run: cd lambdas && pip install stripe -t . --quiet

      - name: Validate deploy configuration
        env:
          ROLE_ARN: ${{ secrets.AGENTCOMMS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::Set AGENTCOMMS_DEPLOY_ROLE_ARN on the production GitHub environment before deploying from main."
            exit 1
          fi
          echo "Deploying AgentComms with stage=$AGENTCOMMS_DEPLOY_STAGE envName=$AGENTCOMMS_DEPLOY_ENV_NAME domain=$AGENTCOMMS_DOMAIN"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AGENTCOMMS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Validate CDK bootstrap
        run: |
          if ! aws ssm get-parameter --name /cdk-bootstrap/hnb659fds/version >/dev/null 2>&1; then
            echo "::error::Bootstrap the AWS account/region before deploying: cd cdk && npx cdk bootstrap aws://ACCOUNT_ID/${AWS_REGION:-us-east-1}"
            exit 1
          fi

      - name: CDK Deploy
        # Deploy only the AgentComms stacks: data, events, API, adapters, and
        # public landing site. Retired legacy stacks are excluded
        # so they are not re-synthed or re-deployed.
        run: |
          cd cdk
          npx cdk deploy 'AgentComms*' \
            --context stage="$AGENTCOMMS_DEPLOY_STAGE" \
            --context envName="$AGENTCOMMS_DEPLOY_ENV_NAME" \
            --context domain="$AGENTCOMMS_DOMAIN" \
            --require-approval never
