name: test
on:
  pull_request:
    branches: [main, develop, phase1-foundation]
  push:
    branches: [main, develop, phase1-foundation]
jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt pytest pytest-cov moto faker pyotp pydantic python-ulid jsonschema
          pip install -e sdks/python
      - run: |
          source .venv/bin/activate
          pytest tests/core tests/api tests/e2e adapters -v --maxfail=10
      - run: |
          source .venv/bin/activate
          cd sdks/python && pytest tests -v
  cdk:
    name: CDK tests + synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cdk/package-lock.json
      - run: cd cdk && npm ci && npm test && npx tsc --noEmit
      - run: cd cdk && npx cdk synth AgentCommsData AgentCommsEvents > /dev/null  # no AWS creds required for basic synth
  cli:
    name: CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd cli && npm ci && npm run build && npm test
  sdk-node:
    name: Node SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd sdks/node && npm ci && npm run build && npm test
  mcp:
    name: MCP server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd mcp && npm ci && npm run build && npm test
