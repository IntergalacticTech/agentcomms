[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freemail"
version = "0.1.0"
description = "Python SDK for the FreeMail email platform"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["httpx>=0.27.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["freemail*"]
