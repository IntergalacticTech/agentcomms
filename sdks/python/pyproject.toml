# SPDX-License-Identifier: FSL-1.1-Apache-2.0
[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcomms"
version = "1.0.0"
description = "Official Python SDK for AgentComms — the agent communications hub."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "FSL-1.1-Apache-2.0" }
authors = [{ name = "Victory", email = "sdks@agentcomms.dev" }]
dependencies = [
  "requests>=2.31",
  "pydantic>=2.0,<3",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: Other/Proprietary License",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://agentcomms.dev"
Repository = "https://github.com/IntergalacticTech/FreeMail.ai"
Documentation = "https://agentcomms.dev/docs"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentcomms*", "freemail*"]
